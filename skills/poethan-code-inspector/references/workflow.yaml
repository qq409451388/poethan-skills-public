version: 5.0.0

issue_content:
  default_required: [title, summary, dimension, severity]
  optional_when_useful: [expected_outcome, technical_note, local_terms, evidence]
  summary: 一段短文或最多 3 个要点，只保留现象、影响和结论；用户不需要依靠它完成当前决策。
  technical_note: 只保存回看所需的关键证据和代码位置；完整 Agent 方案与争论留在讨论/活动历史，不复制进正文。
  omit: [Agent 推理过程, 长日志, 完整代码, 重复评级, 无助于人工判断的字段]
  code_location: 优先文件路径加类、方法或符号；行号只作为创建时快照的辅助提示，不能成为唯一定位依据。
  terminology: 通用技术名词无需解释；只解释项目内、业务内或 Agent 临时定义且人工可能未对齐的词。

collaboration_records:
  discussion:
    commands: [discussion-topic-create, discussion-topic-list, discussion-append, discussion-list, discussion-amend]
    purpose: 保存尚未定论的方案、实现和验证交流；不进入默认处理历史。
    correction: 原作者必须 amend 原消息，不追加“更正”或“以此为准”。
    ui_projection:
      includes_activity_types: [DESIGN_SUBMITTED, REDESIGN_SUBMITTED, STAGE_SUBMITTED, IMPLEMENTATION_SUBMITTED]
      rationale: 这些正式提交既是工作流里程碑，也是等待另一角色阅读和反馈的协作内容，因此同时出现在讨论视图。
      storage_rule: 只保留原 Activity，不复制为 issue_discussion；讨论视图是跨两类记录的只读投影。
  conclusion:
    command: decision-record
    normal_role: inspector
    purpose: 讨论达成一致后，整理为一条短小、可执行、可供后续判断的有效结论。
    source: 使用 source-discussion-ids 关联讨论依据。
    supersession: 相同 decision_type + scope_key 的新结论替代旧结论；旧结论仅留审计。
  processing_history: 展示正式结论与工作流里程碑；协作提交可同时投影到讨论视图，但不得重复落库。
  combined_view: 页面默认提供去重后的全部记录并按最新优先展示，同时保留讨论和处理历史两个筛选视图。

task_types:
  REVIEW:
    meaning: 一次边界明确的代码检查治理目标。
    identity_fields: [project_path, review_level, objective, review_scope, baseline_ref]
    baseline_in_identity: true
    completion: 由 inspector 或 human 显式 CLOSED / CANCELLED；现有严格扫描规则不变。
  CONTINUOUS:
    meaning: 长期存在、可跨多个代码基线持续新增问题的治理主题。
    identity_fields: [project_path, task_type, objective, review_scope]
    baseline_in_identity: false
    completion: 所有 issue 均终结也不自动关闭；仅 inspector 或 human 可显式 CLOSED / CANCELLED。
  default: REVIEW
  immutable_after_creation: true

task_statuses: [PENDING, IN_PROGRESS, ON_HOLD, BLOCKED, CLOSED, CANCELLED]
task_transitions:
  PENDING: [IN_PROGRESS, ON_HOLD, BLOCKED, CLOSED, CANCELLED]
  IN_PROGRESS: [ON_HOLD, BLOCKED, CLOSED, CANCELLED]
  ON_HOLD: [PENDING, IN_PROGRESS, BLOCKED, CLOSED, CANCELLED]
  BLOCKED: [PENDING, IN_PROGRESS, ON_HOLD, CLOSED, CANCELLED]
  CLOSED: []
  CANCELLED: []

task_status_authority:
  inspector: 必须遵守 task_transitions；终态不能自行重新打开。
  human: 可通过 task-update-status 将 Task 调整为任一合法 task_status，包括纠正或重新打开终态任务；所有变更仍保留领域校验与审计。
  rationale: Human 对任务及问题状态具有最高管理权限，Agent 仍遵守各自工作流约束。

task_close_cascade:
  trigger: task-update-status --status CLOSED
  atomicity: Task 状态更新、未终结 Issue 取消、Activity 与审计必须在同一事务中完成。
  issue_behavior:
    open_statuses: 转为 CANCELLED，并追加 STATUS_CHANGED，metadata 标明由 Task 关闭触发。
    terminal_statuses: CONFIRMED / CANCELLED 保持不变，不重复追加活动。
  stage_behavior: active Stage Plan 标记为 SUPERSEDED，保留已批准 Stage 和全部历史。
  non_triggers: Task 转为 PENDING / IN_PROGRESS / ON_HOLD / BLOCKED / CANCELLED 时不同步 Issue。
  rationale: 关闭治理范围应停止其未完成 Issue，但不能把未验证问题伪装成 CONFIRMED。

task_identity:
  definition: 一个稳定的代码检查或持续治理目标，不是一轮扫描或单个问题。
  explicit_task_key: 若提供 task_key，优先复用该活动 task；项目路径或 task_type 冲突时拒绝。
  review_compatibility: REVIEW 继续使用升级前的 fingerprint 算法，保证历史 task 可复用。
  active_for_reuse:
    REVIEW: [PENDING, IN_PROGRESS]
    CONTINUOUS: [PENDING, IN_PROGRESS, ON_HOLD, BLOCKED]
  create_new_when:
    - REVIEW 的检查目标、范围或独立基线发生实质变化
    - CONTINUOUS 的治理目标或治理范围发生实质变化
    - 已有 task 已关闭或取消
  list_default: [PENDING, IN_PROGRESS, ON_HOLD, BLOCKED]

task_operation_modes:
  scan:
    triggers: [继续审核, 扫描项目, 专项检查, 完整代码检查]
    applies_to: [REVIEW, CONTINUOUS]
    requires: [coverage_closure, cross_module_review, dedupe, supplemental_scan]
  report:
    triggers: [记录线上 Bug, 加入长期治理任务, 记录线上故障]
    applies_to: [CONTINUOUS]
    requires: [verify_evidence, validate_issue, dedupe, create_candidate_or_issue]
    does_not_require: [full_project_scan, coverage_closure]

scan_persistence:
  collect_before_persist: true
  steps:
    - 扫描期间在会话内收集候选问题，不创建 issue
    - 串联入口、生产、传输或存储、消费、确认、清理、保留和监控各端
    - 初步合并后执行覆盖面回查并寻找覆盖空白
    - 对覆盖空白执行补充扫描；候选数量或并行扫描完成不能替代覆盖判断
    - 按根因、修复边界和风险链路去重，仅批量创建成立的正式 issue
  issue_identity: 同一根因、同一修复边界、同一风险链路为一个 issue；多个位置作为同一 issue 的 evidence。
  duplicate_policy:
    - 与未终态 issue 的 dedupe_key 相同则跳过创建并补充活动或证据
    - 已 CONFIRMED 的问题复发时创建新的 issue 和版本

coverage_closure:
  mandatory_for_scan: true
  parallel_scan_rule: 并行子代理只负责局部扫描；主审核者必须额外执行跨模块横切检查。
  cross_module_data_flow:
    identify: [外部入口和生产端, 中间状态与存储, 消费重试恢复端, ACK与状态标记, 清理归档容量上限, 指标与告警]
    verify:
      - 每类数据或资源都有所有者、终止条件和清理责任方
      - 确认动作不能被默认视为清理动作；已处理或已确认不等于实体或持久化数据已删除
      - 比较生产、消费和清理速率，检查无界增长与容量风险
      - 失败、重试、恢复、重复消费和崩溃时生命周期仍能闭环

issue_statuses:
  - PROPOSED
  - DESIGN_REQUIRED
  - DESIGN_PENDING_REVIEW
  - IN_PROGRESS
  - ON_HOLD
  - BLOCKED
  - INSPECTOR_CONFIRMATION_REQUIRED
  - IMPLEMENTED_PENDING_REVIEW
  - REDESIGN_REQUIRED
  - HUMAN_CONFIRMATION_REQUIRED
  - CONFIRMED
  - CANCELLED


# Human 可人工覆盖到任一合法状态；Agent 仍遵守专用入口和验证前置条件。
human_issue_override_statuses: &human_issue_override_statuses
  [PROPOSED, DESIGN_REQUIRED, DESIGN_PENDING_REVIEW, IN_PROGRESS, ON_HOLD, BLOCKED,
   INSPECTOR_CONFIRMATION_REQUIRED, IMPLEMENTED_PENDING_REVIEW, REDESIGN_REQUIRED,
   HUMAN_CONFIRMATION_REQUIRED, CONFIRMED, CANCELLED]

# 领域状态图。Inspector/Developer 的设计边与 Human confirmation 边必须使用对应原子命令。
transitions:
  PROPOSED:
    inspector: [DESIGN_REQUIRED, IN_PROGRESS, ON_HOLD, BLOCKED, CONFIRMED, CANCELLED]
    developer: [IN_PROGRESS, ON_HOLD, BLOCKED, INSPECTOR_CONFIRMATION_REQUIRED, IMPLEMENTED_PENDING_REVIEW]
    human: *human_issue_override_statuses
  DESIGN_REQUIRED:
    inspector: [CANCELLED]
    developer: [DESIGN_PENDING_REVIEW]
    human: *human_issue_override_statuses
  DESIGN_PENDING_REVIEW:
    inspector: [IN_PROGRESS, DESIGN_REQUIRED, CANCELLED]
    developer: []
    human: *human_issue_override_statuses
  IN_PROGRESS:
    inspector: [DESIGN_REQUIRED, ON_HOLD, BLOCKED, CANCELLED]
    developer: [ON_HOLD, BLOCKED, INSPECTOR_CONFIRMATION_REQUIRED, IMPLEMENTED_PENDING_REVIEW]
    human: *human_issue_override_statuses
  ON_HOLD:
    inspector: [IN_PROGRESS, BLOCKED, CANCELLED]
    developer: [IN_PROGRESS, BLOCKED, INSPECTOR_CONFIRMATION_REQUIRED]
    human: *human_issue_override_statuses
  BLOCKED:
    inspector: [IN_PROGRESS, ON_HOLD, CANCELLED]
    developer: [IN_PROGRESS, ON_HOLD, INSPECTOR_CONFIRMATION_REQUIRED]
    human: *human_issue_override_statuses
  INSPECTOR_CONFIRMATION_REQUIRED:
    inspector: [IN_PROGRESS, ON_HOLD, BLOCKED, CANCELLED]
    developer: []
    human: *human_issue_override_statuses
  IMPLEMENTED_PENDING_REVIEW:
    inspector: [IN_PROGRESS, REDESIGN_REQUIRED, CONFIRMED, ON_HOLD, BLOCKED, CANCELLED]
    developer: []
    human: *human_issue_override_statuses
  # REDESIGN_REQUIRED 下 Inspector 的 design-request 修订边是原子命令，不走通用状态表。
  REDESIGN_REQUIRED:
    inspector: [ON_HOLD, BLOCKED, CANCELLED]
    developer: [DESIGN_PENDING_REVIEW, ON_HOLD, BLOCKED, INSPECTOR_CONFIRMATION_REQUIRED]
    human: *human_issue_override_statuses
  HUMAN_CONFIRMATION_REQUIRED:
    inspector: []
    developer: []
    human: *human_issue_override_statuses
  CONFIRMED: {inspector: [], developer: [], human: *human_issue_override_statuses}
  CANCELLED: {inspector: [], developer: [], human: *human_issue_override_statuses}

issue_status_authority:
  inspector_and_developer: 必须遵守 transitions、设计原子命令、实现提交与验证前置条件。
  human: 可通过 issue-update-status 覆盖到任一合法状态，包括 HUMAN_CONFIRMATION_REQUIRED、CONFIRMED 和重开终态；变更会记录 STATUS_CHANGED 与审计。
  agent_escalation: Inspector 进入 HUMAN_CONFIRMATION_REQUIRED 仍使用 human-escalate；Developer 不得发起升级。
  agent_final_confirmation: Inspector关闭前核对当前正式实现、修订、派工授权及对应标准验收记录。

design_workflow:
  default: Inspector分析讨论 -> design-dispatch -> implementation-submit -> implementation-review
  inspector_owns: [原始需求, 原因与事实, 可执行方案, 边界, 关键方向选择, 验收标准, 是否分阶段, 最终验收]
  developer_owns: [实现, 调查与验证, 命名和局部组织, 事实反证报告]
  plan_fields: [content, boundaries, acceptance, execution_mode]
  dispatch:
    roles: [inspector]
    command: design dispatch ISSUE @plan.json
    effects: [保存不可变DESIGN_APPROVED方案与授权, 自动记录有效结论, 必要时原子创建Stage并激活首阶段, 进入IN_PROGRESS]
    authorization: 状态和通用活动不能替代真实批准；推进引用context中的authorization.activity_id。
    revision: 新草稿、重设计和新方案使旧授权失效；旧活动保留审计。
  confirmation:
    optional_draft: design request ISSUE @plan.json 保存Inspector草稿，不等待dev提案。
    ordinary: 沿用preview/confirm绑定草稿及变化项；dispatch引用draft_id和confirmation_ids，不重抄正文。
    human: 已授权技术判断由Inspector决定；业务取舍、范围变化或风险授权才询问Human，不重复到Web确认。
    invalidation: 修订草稿后不匹配的确认失效，不自动转移到另一方案。
  compatibility: 旧dev提案与审批入口仅保留明确历史协作；新任务默认派工流程，不存在批准的旧任务不自动放行。
  boundary: 命令与业务层校验不等同于文件系统隔离。
  minimum_design:
    rule: 双方只使用当前需求和有依据失败场景所需的最少机制；不为未来假设无限加固。
    change: 新增机制或方向变化先说明最直接方案、具体收益、成本和失败语义，由Inspector判断，必要时询问Human。
    no_extra_workflow: 不增加防过度设计审批表，不吞异常或自行降级掩盖错误。

design_depth:
  rule: Inspector依据原因、边界、处理方式与验证方法是否清楚决定开工；不能由dev自行放行。
  simple: 几句话形成可执行方案，一次dispatch；不强制草稿、dev提案或Stage。
  complex: 充分展开关键方向与容易返工的选择，可仍采用direct，不按数据库或状态机关键词自动升级。
  stage_independence: 复杂度和Stage独立；中间成果具有独立验收价值、能降低后续风险才staged。

stage_workflow:
  principle: Stage 是有独立验收价值的串行执行单元，也是递增验收基线；不属于 Issue.status，执行期间 Issue 保持 IN_PROGRESS。
  use_for: [中间结果可独立验收且降低后续风险]
  simple_issue: 不创建 Stage Plan，保持原有直接实现路径。
  statuses: [PLANNED, IN_PROGRESS, PENDING_REVIEW, APPROVED, SUPERSEDED]
  identity: [issue_id, plan_no, stage_no]
  governance_versions:
    1: migration 前已有 Stage，保留原命令行为以便继续完成，不强制补历史结构化数据。
    2: 结构化审核、累计回归和baseline gate；Inspector新派工继承边界，旧计划仍要求开发前声明。
  plan_create:
    atomic_command: design-dispatch（execution_mode为staged）；旧审批入口保持兼容
    roles: [inspector, human]
    normal_role: inspector
    allowed_from_issue_status: 发布方案所允许的非终态
    required_stage_fields: [stage_no, title, objective, acceptance_criteria]
    conditional_stage_field: 设计存在 scope_changes 时，相关 Stage 必须填写 scope_change_ids，且全部变化都要分配；未知或遗漏引用时原子审批失败。
    activity: STAGE_PLAN_CREATED 与 DESIGN_APPROVED 同事务写入
    initial_stage_status: PLANNED
    numbering: stage_no 必须从 1 连续递增；新计划 plan_no 使用历史最大值加一。
    governance_version: 2
  design_approval_effect:
    issue: IN_PROGRESS
    first_stage: PLANNED -> IN_PROGRESS
    remaining_stages: PLANNED
  serial_rule:
    - 同一 active plan 同时至多一个 Stage 为 IN_PROGRESS 或 PENDING_REVIEW
    - Developer 只能提交当前 IN_PROGRESS Stage，不能提前实施或提交后续 Stage
    - Stage 提交后停止后续业务代码修改，等待 Inspector 验收
  prepare:
    atomic_command: stage-prepare
    roles: [developer, human]
    normal_role: developer
    timing: 旧计划修改业务代码前；Inspector 新派工仅在需要补充局部影响时使用
    allowed_stage_status: IN_PROGRESS
    required: [change_scope, change_reason, protected_behaviors]
    activity: STAGE_SCOPE_DECLARED
    rules:
      - change_scope 明确预计修改的模块、文件、类或方法以及原因
      - Stage 2+ 必须读取所有历史 PASSED baseline，并声明哪些历史行为不得改变
      - 旧计划沿用 prepare 前置条件；新派工直接继承边界和历史 baseline，仍须核对历史行为
  submit:
    atomic_command: stage-submit
    roles: [developer, human]
    required: [issue_key, stage_no, content, commit_sha, diff_summary, code_reference, test_evidence]
    optional: [resolved_findings, metadata]
    allowed_stage_status: IN_PROGRESS
    activity: STAGE_SUBMITTED
    transition: IN_PROGRESS -> PENDING_REVIEW
    attempt_effect: none
    rules:
      - governance v2 的旧计划必须prepare；Inspector新派工继承已发布边界
      - code_reference 与 diff_summary 表达本阶段实际 Diff，test_evidence 同时覆盖当前测试与历史累计回归
      - 驳回后的再次提交只需修 BLOCKER/MUST，并在 resolved_findings 中逐项列出对应 id
      - SHOULD/NIT 不要求 Dev 为当前 Stage 修复
  review_approved:
    atomic_command: stage-review --decision approved
    roles: [inspector, human]
    activity: STAGE_APPROVED
    transition: PENDING_REVIEW -> APPROVED
    next_effect: 自动把下一个 PLANNED Stage 转为 IN_PROGRESS；全部通过时 Issue 仍保持 IN_PROGRESS。
    runtime_gate: BLOCKER=0、MUST=0、全部 current_acceptance PASS、全部 historical_regression PASS 时必须 PASS；SHOULD/NIT 只保存在 Backlog。
    baseline_required:
      fields: [verified_behaviors, input_output_contracts, business_semantics, tests]
      status: PASSED
      inheritance: 当前 baseline 记录继承的全部历史 stage_no；后续 Stage 逐项核对仍适用的验证证据，失效或未覆盖时补验。
  review_rejected:
    atomic_command: stage-review --decision rejected
    roles: [inspector, human]
    activity: STAGE_REJECTED
    transition: PENDING_REVIEW -> IN_PROGRESS
    rule: 只修正当前阶段，不得偷偷更换整体设计；必须存在 BLOCKER/MUST 或明确失败的验收检查，不能因 SHOULD/NIT 驳回。
  design_failure:
    atomic_command: stage-review --decision redesign
    roles: [inspector, human]
    activities: [STAGE_REJECTED, STAGE_PLAN_SUPERSEDED]
    issue_transition: IN_PROGRESS -> REDESIGN_REQUIRED
    plan_effect: 当前计划 plan_status -> SUPERSEDED；未完成 Stage -> SUPERSEDED，已 APPROVED Stage 保留原状态、时间和验收记录。
    recovery: Inspector修订方案，必要时保存草稿确认，然后design-dispatch；无需dev重新提案。
  final_submission_gate: 有 active Stage Plan 时，全部 Stage APPROVED 后才允许 implementation-submit；最终整体验证不可被阶段验收替代。
  historical_regression_gate:
    required_for: Stage 2 及以后每轮验收
    coverage: 必须逐项覆盖当前 plan 内全部已 APPROVED Stage。
    checks: [当前 Diff 是否修改历史核心代码, 历史行为和输入输出契约是否仍成立, 历史测试是否全部通过, 是否存在 Breaking Change]
    failure_level: BLOCKER
  finding_levels:
    BLOCKER: 功能、数据、安全、运行失败、核心业务语义错误或历史 Stage 破坏；阻断验收。
    MUST: 明确违反当前需求、已批准设计、Stage 验收标准或强制工程规范；阻断验收。
    SHOULD: 可维护性、抽象、潜在性能或非必要重构建议；只进 Backlog，不阻断。
    NIT: 命名、格式、极小风格或个人偏好；只进 Backlog，不阻断。
  convergence:
    first_review: 可提出所有等级问题，每条 finding 使用稳定 id。
    later_reviews:
      - 不得新增 SHOULD/NIT，除非由本轮修复 BLOCKER/MUST 新引入，并提供 introduced_by_fix=true 与 evidence
      - 新增 BLOCKER/MUST 必须提供 why_not_found_earlier、evidence 和实际 risk
      - 禁止以感觉可更好、最好重构、以后可能有问题、不够优雅或可以继续优化作为阻断理由
    mandatory_stop: BLOCKER/MUST 清零且当前验收、历史回归全部 PASS 后，Inspector 必须 PASS 并结束当前 Stage。
  review_output:
    inspection_result: PASS | FAIL
    sections: [BLOCKER, MUST, SHOULD, NIT, Historical Regression, Current Stage Acceptance]
    final_decision: PASS | REJECT
    invariant: 只有 BLOCKER/MUST 或真实验收失败可以 REJECT；SHOULD/NIT 永远不能改变 PASS。
    automatic_gate: governance v2 可使用 stage-review --decision auto，由 Runtime 根据上述 invariant 得出 PASS/REJECT；设计整体失效仍需显式 redesign。
  history: 旧 plan、Stage 主键、开发前声明、结构化提交证据、所有 Review round、验收结果、baseline 和 Activity 身份均不得删除或覆盖；Developer/Inspector 自己提交的活动正文可用 activity-amend 修订，旧正文转存独立 revision 历史且不再作为当前判断依据。

implementation_review:
  submission:
    command: implementation-submit
    precondition: 当前有效派工授权，IN_PROGRESS；有Stage时全部通过。
    atomic_effects: [正式实现活动, attempt加一, IMPLEMENTED_PENDING_REVIEW]
    reference: 新派工必须显式authorization-id，不隐式采用最新方案。
  review:
    command: implementation-review
    roles: [inspector, human]
    binds: [submission_id, submission_revision, authorization_id]
    checks: [原始需求requirements, 当前方案AC-n验收项, 具体阻断项, 有效证据]
    atomic_effects: [验证活动, 有效结论, 状态, 可选进度]
    pass: CONFIRMED且自动进度100；不能仅因实现照方案写就通过。
    fix: IN_PROGRESS，沿用方案；说明具体错误、证据和风险。
    replan: REDESIGN_REQUIRED，撤销授权并废弃旧Stage Plan，由Inspector重新规划。
    convergence: 非阻断建议不阻止通过；需求或验收失败不得关闭。
  evidence_reuse:
    identity: 引用本Issue的真实证据活动与修订号。
    applicability: Inspector说明代码、依赖、环境及范围仍适用；快照不同提供differences，没有旧快照补source_conditions，否则补验。
    scope: Runtime核对引用与明确冲突，Inspector对覆盖语义负责；不建设通用证据中心。
  human_override: 真实Human保留人工覆盖入口，记录为人工决定，不生成伪造dev提交或标准验收。

human_escalation:
  principle: Human escalation 是极低频异常路径；正常设计、实现、验证与确认由 Inspector 和 Developer 自主闭环。
  distinction:
    INSPECTOR_CONFIRMATION_REQUIRED: Developer 请求 Inspector 做正常技术边界判断，不通知 Human。
    HUMAN_CONFIRMATION_REQUIRED: Inspector 确认两个 Agent 无法获得关键决策事实，或继续自动决策存在重大不可逆数据风险。
  agent_entry:
    atomic_command: human-escalate
    role: inspector
    activity: HUMAN_CONFIRMATION_REQUESTED
    target: HUMAN_CONFIRMATION_REQUIRED
    required: [reason, question]
    optional: [options, evidence, recommended_option]
  allowed_reasons:
    unavailable_decision_fact:
      - 关键业务事实或外部约束无法从代码、测试、数据库结构、项目文档、协议、历史活动或可获得运行数据确认
      - 未知条件直接决定实现结果，且继续设计指导仍无法消除
    irreversible_data_risk:
      - 方案可能造成无法通过正常重试恢复的重大数据破坏
      - 包括不可逆历史重写、无可靠回滚的数据修复或迁移、跨租户污染、账务支付结算事实永久错误
  forbidden_reasons: [Inspector 自己不确定, Developer 方案质量不足, 首次实现或测试失败, 普通架构选择, 代码风格, 普通性能取舍, 模块边界讨论, 两种技术方案都可工作]
  preflight_questions:
    - 能否通过继续阅读代码解决
    - 能否通过测试、数据库、日志或运行数据验证
    - 能否通过方案讨论或 Inspector 的合理技术判断解决
    - 判断错误是否确有重大不可逆风险
    - Human 是否掌握 Agent 无法获得的业务事实
  request_summary_must_include: [为什么必须人工决定, 关键事实, 已验证内容, 无法确认内容, 方案及主要影响, Inspector 推荐, Human 只需回答的问题]
  request_summary_must_not_include: [未经整理的长日志, 完整代码, Agent 对话记录]
  future_orchestrator_contract: 若未来启用 Orchestrator，任一 issue 进入 HUMAN_CONFIRMATION_REQUIRED 时 Resolver 应返回 next_actor=HUMAN、needs_human=true 并暂停 Task；Human resolve 后再重新计算并恢复。本次 runtime 不依赖或修改 Orchestrator。
  resolution:
    atomic_command: human-confirmation-resolve
    role: human
    activity: HUMAN_CONFIRMATION_PROVIDED
    default_next_status: DESIGN_REQUIRED
    allowed_next_statuses: [DESIGN_REQUIRED, IN_PROGRESS, ON_HOLD, BLOCKED, CANCELLED]
    forbidden_next_statuses: [CONFIRMED]
    note: Human 只解决业务边界、事实归属或风险接受；Inspector 仍负责设计审核、实现审核、验证和最终确认。

confirmation_protocol:
  developer_request: {status: INSPECTOR_CONFIRMATION_REQUIRED, content_required: true}
  inspector_response:
    command: issue status ISSUE IN_PROGRESS --authorization-id ID --content 本次澄清
    atomic_effects: [绑定本次问询和授权的INSPECTOR_CONFIRMATION_PROVIDED, 有效结论, 恢复执行]
    direction_change: 不复用旧授权，Inspector修订方案并重新派工；dev可只提供事实。
  final_confirmation:
    inspector_precondition: 当前实现活动、修订和授权对应的VERIFICATION_PASSED；FastMode不能替代标准验收。
    human_override: Human可人工设置合法状态并保留审计。

activity_types:
  design: [DESIGN_REQUESTED, DESIGN_SUBMITTED, DESIGN_APPROVED, DESIGN_REJECTED]
  legacy_discussion: [COMMENT_ADDED, DESIGN_GUIDANCE]
  stage: [STAGE_PLAN_CREATED, STAGE_SCOPE_DECLARED, STAGE_SUBMITTED, STAGE_APPROVED, STAGE_REJECTED, STAGE_PLAN_SUPERSEDED]
  human_confirmation: [HUMAN_CONFIRMATION_REQUESTED, HUMAN_CONFIRMATION_PROVIDED]
  legacy_read_compatible: [REVIEW_APPROVED, REVIEW_REJECTED, REDESIGN_SUBMITTED]

candidate_review:
  transitions:
    SUBMITTED: [UNDER_REVIEW, ACCEPTED, REJECTED]
    UNDER_REVIEW: [ACCEPTED, REJECTED]
    ACCEPTED: []
    REJECTED: []
  rules:
    - developer 仅使用 candidate-submit 提交，不调用 issue-create
    - ACCEPTED 只表示候选成立，不自动创建正式 issue

version_rules:
  create_only_for_new_independent_issues: true
  evidence_design_or_redesign_does_not_create_version: true
  implementation_attempt_only: current_attempt_no 只随最终 implementation-submit 递增；设计与 Stage 创建、提交、审核均不递增。
