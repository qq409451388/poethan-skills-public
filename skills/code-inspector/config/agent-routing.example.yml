# Agent Model Routing 示例配置。
#
# 这个功能是可选的：
#   - 把本文件复制为 ~/.agent-review/config/agent-routing.yml 后才启用 Model Router。
#   - 文件不存在时 Inspector 照常工作，Issue 照常创建，只是没有推荐执行配置。
#   - 文件存在但校验失败时不启用 Router，并在 WebApp「模型路由配置」页面显示原因。
#
# 每条记录都是一个 Dev 执行配置（Dev Execution Profile）：哪个 Agent、用哪个 Model、
# 什么 Reasoning、达到什么等级。role 不是可配置维度——执行配置只代表 Developer 能力。
#
# 等级语义：level >= issue.difficulty 表示该执行配置可以完成该任务。
# level 取离散值 1..5，与 Inspector 的 difficulty 使用同一尺度。
#
# 可选的 Model 与 Reasoning 档位来自 Skill 内置能力表 agent-capabilities.yml；
# 未收录的模型也可以填写，此时 Reasoning 使用通用档位集合。

version: 2

profiles:
- id: codex-gpt-5.6-sol-high
  agent: codex
  model: gpt-5.6-sol
  reasoning: high
  level: 3
  enabled: true

- id: codex-gpt-5.1-codex-mini
  agent: codex
  model: gpt-5.1-codex-mini
  reasoning: medium
  level: 2
  enabled: true

- id: claude-opus-5-1m
  agent: claude
  model: claude-opus-5[1M]
  reasoning: high
  level: 4
  enabled: true
