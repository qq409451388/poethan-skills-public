# Agent / Model 能力元数据（Skill 内置）。
#
# 结构：agent -> models[] -> supportedReasonings[]
#   - 同一个 Agent 可以维护多个 Model；
#   - 每个 Model 有自己支持的 reasoning 档位，不做统一列表、不假设都支持 high/xhigh。
#
# WebApp 的 Model 下拉与 Reasoning 下拉都从这里生成；后端校验同一份数据，
# 保证前后端可表达的集合完全一致。
#
# 这里只维护「本机可能用到」的常见组合，可以按需增删。未列入的模型不会导致配置
# 失败：后端与页面会退回下面的通用档位集合（none/minimal/low/medium/high/xhigh）。

version: 1

agents:
- agent: codex
  models:
  - model: gpt-5.6-sol
    supportedReasonings:
    - minimal
    - low
    - medium
    - high
  - model: gpt-5.6
    supportedReasonings:
    - minimal
    - low
    - medium
    - high
  - model: gpt-5.1-codex
    supportedReasonings:
    - low
    - medium
    - high
  - model: gpt-5.1-codex-mini
    supportedReasonings:
    - low
    - medium
    - high

- agent: claude
  models:
  - model: claude-opus-5[1M]
    supportedReasonings:
    - low
    - medium
    - high
  - model: claude-sonnet-5[1M]
    supportedReasonings:
    - low
    - medium
    - high
  - model: claude-fable-5[1M]
    supportedReasonings:
    - low
    - medium
    - high
  - model: claude-haiku-4-5
    supportedReasonings:
    - low
    - medium
    - high

- agent: dsh
  models:
  - model: deepseek-flash
    supportedReasonings:
    - none
  - model: glm-5.3
    supportedReasonings:
    - low
    - medium
    - high
