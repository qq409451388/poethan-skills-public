version: 2.0.0

enums:
  task_type: [REVIEW, CONTINUOUS]
  review_level: [L1, L2, L3]
  dimension:
    - functional_correctness
    - data_security
    - stability_concurrency
    - performance
    - architecture_extensibility
    - code_quality
    - test_observability
  severity: [critical, high, medium, low]
  issue_status:
    - PROPOSED
    - DESIGN_REQUIRED
    - DESIGN_PENDING_REVIEW
    - IN_PROGRESS
    - ON_HOLD
    - BLOCKED
    - INSPECTOR_CONFIRMATION_REQUIRED
    - HUMAN_CONFIRMATION_REQUIRED
    - IMPLEMENTED_PENDING_REVIEW
    - REDESIGN_REQUIRED
    - CONFIRMED
    - CANCELLED

report:
  report_id: {type: string, required: true}
  task_type: {type: enum, ref: task_type, required: false, default: REVIEW}
  project: {type: string, required: true}
  review_level: {type: enum, ref: review_level, required: true}
  review_scope: {type: string, required: true}
  generated_at: {type: datetime, required: true}
  summary:
    type: object
    required: true
    fields:
      total: {type: integer}
      open: {type: integer}
      confirmed: {type: integer}
      critical: {type: integer}
      high: {type: integer}
  issues:
    type: array
    required: true
    item:
      issue_id: {type: string, required: true}
      title: {type: string, required: true}
      summary: {type: markdown_string, required: true}
      dimension: {type: enum, ref: dimension, required: true}
      severity: {type: enum, ref: severity, required: true}
      status: {type: enum, ref: issue_status, required: true}
      expected_outcome: {type: markdown_string, required: false}
      technical_note: {type: markdown_string, required: false}
      local_terms:
        type: object
        required: false
        purpose: 只解释项目内、业务内或 Agent 临时定义且人工可能未对齐的词。
      evidence:
        type: array
        required: false
        item:
          file_path: {type: string, required: true}
          class_name: {type: string, required: false}
          method_name: {type: string, required: false}
          symbol: {type: string, required: false}
          line_start: {type: integer, required: false, note: 仅为创建时快照提示}
          line_end: {type: integer, required: false, note: 仅为创建时快照提示}
          code_excerpt: {type: string, required: false}
      effective_decisions:
        type: array
        required: false
        item:
          decision_type: {type: string, required: true}
          scope_key: {type: string, required: false}
          outcome: {type: string, required: true}
          content: {type: markdown_string, required: true}

content_rules:
  summary: 一段短文或 2–5 个要点，直指现象、影响和关键原因。
  markdown: 只使用段落、少量列表、加粗和行内代码；确需展示代码时再用 fenced code block。
  omit: [Agent 推理过程, 长日志, 完整代码, 重复评级, 空字段]
  code_location: 文件与类/方法/符号是稳定定位；行号不能作为唯一证据。

sorting:
  order:
    - {field: severity, direction: desc, weights: {critical: 4, high: 3, medium: 2, low: 1}}
    - {field: dimension, direction: desc}
    - {field: issue_id, direction: asc}
