version: 2.0.0

database:
  engine: sqlite
  path: ~/.agent-review/data/review.db
  runtime_tool: ~/.agent-review/bin/review-db.py
  direct_sql: false
  direct_database_access: false

directories:
  data: ~/.agent-review/data
  backups: ~/.agent-review/backups
  exports: ~/.agent-review/exports
  logs: ~/.agent-review/logs
  config: ~/.agent-review/config

database_pragmas:
  foreign_keys: true
  journal_mode: WAL
  busy_timeout_ms: 5000

history:
  issue_activity:
    identity: append_only
    purpose: 工作流里程碑及其审计来源；讨论不写入此表。
    current_content: 只有尚未被审核消费的提交和补充证据可由原逻辑身份通过 activity-amend 覆盖。
    revisions: 被替换正文保存在 issue_activity_revision；审核、验证与人工决定等最终结论不可 amend。
  issue_discussion:
    purpose: 方案、实现、验证和一般讨论；默认与处理历史分开展示。
    current_content: 原作者可用 discussion-amend 修订，普通读取只返回当前正文。
    revisions: 被替换正文保存在 issue_discussion_revision。
  issue_decision:
    purpose: Inspector 从讨论中整理的结论，以及原子审核/验证/人工决定产生的正式结论。
    effective_rule: 同一 issue_id、decision_type、scope_key 只有最新一条 effective=1；旧结论通过 superseded_by_id 留审计。
  agent_audit_log: append_only

domain_tables:
  review_task: 长期检查目标。
  review_issue: inspector 或 human 创建的正式问题；默认正文为 title、summary、expected_outcome、technical_note、local_terms_json，旧详细字段仅作兼容。
  issue_candidate: developer 提交、inspector 审核的新问题候选；不等同于正式 issue。
  issue_stage: 复杂 Issue 的版本化串行执行计划；按 issue_id、plan_no、stage_no 唯一，plan_status 标识整份计划是否废弃；旧计划只废弃不删除，已验收字段和活动保留。
  issue_activity: 正式问题的活动轨迹。
  issue_activity_revision: Developer / Inspector 对自己活动正文的修订历史；不参与普通判断上下文。
  issue_discussion: 与处理历史分离的协作讨论。
  issue_discussion_revision: 讨论正文的修订历史。
  issue_decision: 当前有效结论与被替代结论的审计链。
