version: 1.5.0

session_mode:
  default: inactive
  canonical_start_commands:
    - $code-inspector start
    - $code-inspector start <role-selector>
    - $code-inspector fastmode <issue-key> [<issue-key> ...]
  compatible_start_commands:
    - /code-inspector start
    - /code-inspector start <role-selector>
    - /code-inspector fastmode <issue-key> [<issue-key> ...]
  natural_start_phrases:
    - 进入代码检查模式
    - 开启代码检查模式
  stop_phrases:
    - 退出代码检查模式
    - 关闭代码检查模式
    - $code-inspector stop
    - /code-inspector stop
    - $code-inspector exit
    - /code-inspector exit
  role_selection:
    selector_source: 安装后 SKILL.md 中当前平台的“会话角色选择”
    one_configured_role:
      argument: optional
      behavior: 未传参时使用当前平台唯一配置的角色；也接受该角色的显式 selector。
    multiple_configured_roles:
      argument: required
      behavior: 未传 selector、selector 未知或 selector 对应角色未配置时，不激活模式，并要求用户在当前可用 selector 中明确选择。
    natural_language: 多角色平台使用自然语言开启时也必须明确指定角色或 selector，否则不激活。
    session_lock: 激活后将角色和逻辑身份固定到当前会话模式；后续任务不得触发自动切换。
    switch_role: 先退出当前模式，再用新 selector 重新启动。

fastmode:
  kind: human_coordinated_fast_review
  canonical_command: $code-inspector fastmode RI-XXX [RI-YYY ...]
  compatible_command: /code-inspector fastmode RI-XXX [RI-YYY ...]
  natural_language_activation: forbidden
  role: inspector
  workflow_mode: FASTMODE
  developer_agent_required: false
  human_coordinated: true
  validation:
    minimum_issue_keys: 1
    issue_key_pattern: ^RI-[A-Z0-9][A-Z0-9-]*$
    require_existing_issue: true
    deduplicate: preserve_first_input_order
    missing_issue_behavior: 明确报告该 Issue 不存在，不得换成其他 Issue。
  issue_scope:
    source: 启动命令中去重后的 Issue Key
    storage: session_memory
    expansion: forbidden
    outside_scope_behavior: 禁止操作；旁支发现沿用 Candidate 机制。
  processing_order: serial
  first_read: <fixed_tool> issue context <issue_key>
  first_read_parameter_rule: 使用 --issue-key，禁止使用 --issue-id。
  pending_action_required: false
  runtime:
    multi_thread: forbidden
    watch: forbidden
    developer_thread: forbidden
    developer_session: forbidden
    developer_event: forbidden
    fake_developer_activity: forbidden
  terminal_status_owner: human
  completion_behavior: 分 Issue 记录 PASS/FAIL 并汇总；不得自动 CONFIRMED 或 CANCELLED。
  lifecycle: Session 保持 FastMode；只能重查当前 Scope。更换 Scope 必须先 exit 后重新 fastmode。

multi_thread:
  default: inactive
  require_config_enabled: true
  require_explicit_session_activation: true
  session_scoped: true
  role_scoped: true
  operator_scoped: true
  cross_role_dispatch: forbidden
  activation_phrases:
    - 开启多线程模式
    - 开启 multi-thread
    - 开启 Issue 独立线程
    - 后续每个 Issue 独立 Thread
  deactivation_phrases:
    - 关闭多线程模式
    - 关闭 Issue Thread
    - 回到单会话模式
  activation_rule: config.thread_runtime.multi_thread.enabled=true 且用户在当前 Session 明确开启时才 active。
  activation_feedback: |-
    Code Inspector Multi-Thread 已开启。
    Session:
    role={session_role}
    operator={session_operator_id}
    本 Session 只会调度 {session_operator_id} 的 Issue Thread。
  inactive_behavior: 沿用单 Session Code Inspector；不得 claim Runtime Event 或 start/resume Child Thread。
  deactivation_behavior: 停止自动 dispatch，保留已有 Thread Mapping，后续显式开启时可 resume。
  independent_authorization:
    watch: 持续观察只授权 Watch，不授权 Multi-Thread。
    goal: forbidden

task_creation:
  required: true
  create_when:
    - 会话已进入代码检查模式
    - 用户明确要求开始审核、创建审核任务或对指定范围执行审核
  do_not_create_when:
    - 普通代码问答
    - 普通代码修改
    - 未显式开启代码检查模式的审查建议

workflow_execution:
  required_session_mode: active
  developer_when:
    - 用户要求处理审核问题、提交设计、提交当前 Stage 或提交最终实现
    - 无法确认技术边界时只请求 Inspector，不直接请求 Human
  inspector_when:
    - 用户要求创建审核任务、执行审核、制定或验收 Stage、验证修复或最终确认
    - 仅在穷尽可得事实后仍缺少 Human 独有业务事实，或存在重大不可逆数据风险时发起 Human 异常升级
