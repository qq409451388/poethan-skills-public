version: 3.1.0

command: review-db.py
identity:
  required_argument: --agent
  values: [inspector, developer, human]
  installed_entrypoint:
    rule: developer 和 inspector 必须使用安装器按 alias 生成的专用入口。
    enforced_arguments: [--agent, --operator-id]
    direct_runtime_call: forbidden
  audit_identity: agent_audit_log.agent_id、版本 created_by 和活动 operator_id 使用逻辑 alias。

commands:
  task-create:
    roles: [inspector, human]
    required: [--title, --objective]
    optional: [--task-key, --task-type, --review-level, --review-scope, --baseline-ref, --started-at, --remark]
    defaults: {task-type: REVIEW}
  task-resolve:
    roles: [inspector, human]
    purpose: 按 task 类型的稳定 identity 复用活动 task；不存在时创建。显式 task_key 优先。
    required: [--title, --objective, --review-level, --review-scope]
    optional: [--task-key, --task-type, --baseline-ref, --remark]
    defaults: {task-type: REVIEW}
    identity_note: REVIEW 保留原 baseline identity；CONTINUOUS identity 忽略 baseline_ref，并复用 PENDING/IN_PROGRESS/ON_HOLD/BLOCKED 的同一治理任务。
  task-list:
    roles: [inspector, developer, human]
    optional: [--status, --project-name, --task-type, --include-closed]
    default: 仅返回 PENDING、IN_PROGRESS、ON_HOLD、BLOCKED。
  task-update:
    roles: [inspector, human]
    required: [--task-key]
    optional_one_or_more: [--title, --objective, --remark, --close-reason]
    note: task_type 创建后不可修改，命令不接受 --task-type。
  task-update-status:
    roles: [inspector, human]
    required: [--task-key, --status]
    optional: [--started-at, --finished-at, --close-reason, --remark]
    note: inspector 遵守标准 task_transitions；human 可设置任一合法 Task 状态并可重新打开终态任务。仅转为 CLOSED 时，命令在同一事务中把所有非 CONFIRMED/CANCELLED Issue 转为 CANCELLED、废弃 active Stage Plan 并写入 STATUS_CHANGED；其他 Task 状态变更不同步 Issue。
    returns: [task_key, status, cancelled_issue_count]
  version-create:
    roles: [inspector, human]
    required: [--task-key, --reason]
    note: 通常使用 issue-create-batch 自动创建版本；仅在确有独立新问题且需分步操作时使用。
  issue-create:
    roles: [inspector, human]
    required: [--task-key, --title, --dimension, --severity, --remediation-benefit, --remediation-cost, --disposition, --confidence, --description, --facts, --rationale]
    optional: [--issue-key, --parent-issue-id, --trigger-conditions, --potential-impact, --impact-scope, --evidence, --estimated-change, --dedupe-key]
    json_arguments: [--trigger-conditions, --potential-impact, --impact-scope, --evidence, --estimated-change]
  issue-create-batch:
    roles: [inspector, human]
    required: [--task-key, --reason, --issues]
    json_arguments: [--issues]
    note: 一轮扫描的首选落库命令；自动去重，并且只在存在新 issue 时创建版本。
  issue-list:
    roles: [inspector, developer, human]
    optional: [--task-key, --status, --severity, --dimension, --updated-after, --limit, --fields]
    constraints: {updated-after: ISO-8601 inclusive lower bound to avoid same-second misses, limit: 1..1000, fields: comma-separated allowlisted fields}
    recommended_compact_fields: [issue_key, title, status, severity, dimension, updated_at, last_activity_at, last_comment_at]
    fields_note: 可选择任意 issue-get 返回字段；JSON 字段沿用 evidence_json 等现有响应名。
    returns_activity_summary: [last_activity_at, last_comment_at]
  issue-list-pending-review:
    roles: [inspector, developer, human]
    purpose: 快速返回 IMPLEMENTED_PENDING_REVIEW 问题。
    optional: [--task-key, --updated-after, --limit, --fields]
  issue-get:
    roles: [inspector, developer, human]
    required: [--issue-key]
    note: 返回单条 issue 的完整正文、证据、评级、状态和最近活动时间。
  issue-update-assessment:
    roles: [inspector, human]
    required: [--issue-key]
    optional_one_or_more: [--dimension, --severity, --remediation-benefit, --remediation-cost, --disposition, --confidence]
  issue-update-assessment-batch:
    roles: [inspector, human]
    required: [--updates]
    json_arguments: [--updates]
    item_required: [issue_key]
    item_optional_one_or_more: [dimension, severity, remediation_benefit, remediation_cost, disposition, confidence]
    note: 整批在同一事务中更新；任一项失败则全部回滚；同一批次不得重复 issue_key。
  issue-update-body:
    roles: [inspector, human]
    required: [--issue-key]
    optional_one_or_more: [--title, --description, --facts, --rationale]
  issue-update-status:
    roles: [inspector, developer, human]
    required: [--issue-key, --status]
    optional: [--content]
    note: developer 请求 INSPECTOR_CONFIRMATION_REQUIRED 时 --content 必填；Inspector/Developer 受 workflow.yaml 和原子前置条件约束。Human 具有普通 Issue 状态最高管理权限，可跨状态覆盖并记录 STATUS_CHANGED/审计；但 HUMAN_CONFIRMATION_REQUIRED 仍只能由专用命令进入/离开，CONFIRMED 对所有角色都要求当前 implementation attempt 已有 VERIFICATION_PASSED。
  issue-update-status-batch:
    roles: [inspector, developer, human]
    required: [--updates]
    json_arguments: [--updates]
    item_required: [issue_key, status]
    item_optional: [content]
    note: 整批在同一事务中更新；任一项失败则全部回滚；同一批次不得重复 issue_key。
  implementation-submit:
    roles: [developer, human]
    purpose: 原子追加 IMPLEMENTATION_SUBMITTED 证据并转为 IMPLEMENTED_PENDING_REVIEW。
    required: [--issue-key, --content]
    optional: [--status-content, --code-reference, --metadata]
    json_arguments: [--code-reference, --metadata]
    note: 实现证据与状态变更使用同一新 attempt 和同一事务；设计阶段及 REDESIGN_REQUIRED 禁止提交；存在 active Stage Plan 时必须全部 APPROVED；任一步失败则全部回滚。
  design-request:
    roles: [inspector, human]
    purpose: 原子追加 DESIGN_REQUESTED 并将问题转为 DESIGN_REQUIRED。
    required: [--issue-key, --content]
    allowed_from: [PROPOSED, IN_PROGRESS]
    content_required: true
  design-submit:
    roles: [developer, human]
    purpose: 原子追加 DESIGN_SUBMITTED 并将问题转为 DESIGN_PENDING_REVIEW。
    required: [--issue-key, --content]
    optional: [--code-reference, --metadata]
    json_arguments: [--code-reference, --metadata]
    allowed_from: [DESIGN_REQUIRED, REDESIGN_REQUIRED]
    attempt_effect: none
  design-review:
    roles: [inspector, human]
    purpose: 原子记录明确的设计批准或驳回结论。
    required: [--issue-key, --decision, --content]
    enum: {decision: [approved, rejected]}
    allowed_from: [DESIGN_PENDING_REVIEW]
    effects:
      approved: [追加 DESIGN_APPROVED, 转为 IN_PROGRESS]
      rejected: [追加 DESIGN_REJECTED, 转为 DESIGN_REQUIRED]
  stage-plan-create:
    roles: [inspector, human]
    purpose: 在设计待审核时原子创建一个新的、串行的 Stage Plan；不会修改 Issue 状态或 implementation attempt。
    required: [--issue-key, --stages]
    json_arguments: [--stages]
    allowed_from: [DESIGN_PENDING_REVIEW]
    stage_item_required: [stage_no, title, objective, acceptance_criteria]
    constraints: [stage_no 从 1 连续递增, 同一 issue 同一 plan 不能重复, 已有 active plan 时拒绝]
    effects: [以 governance_version=2 插入 PLANNED Stage, 追加 STAGE_PLAN_CREATED]
  stage-list:
    roles: [inspector, developer, human]
    required: [--issue-key]
    optional: [--plan-no]
    purpose: 返回 Stage Plan 历史及完整阶段字段。
  stage-get:
    roles: [inspector, developer, human]
    required: [--issue-key, --stage-no]
    optional: [--plan-no]
    defaults: {plan-no: 最新计划}
    returns_extra: historical_baselines，包含之前全部 APPROVED Stage 的 baseline 与 PASSED 状态。
  stage-prepare:
    roles: [developer, human]
    purpose: Developer 修改代码前声明当前 Stage 的预计影响范围、修改原因与必须保护的历史行为。
    required: [--issue-key, --stage-no, --change-scope, --change-reason]
    optional: [--protected-behaviors]
    json_arguments: [--change-scope, --protected-behaviors]
    allowed_issue_status: IN_PROGRESS
    allowed_stage_status: IN_PROGRESS
    effects: [保存开发前声明, 追加 STAGE_SCOPE_DECLARED]
    constraints: [Stage 2+ 必须存在历史 PASSED baseline, Stage 2+ protected-behaviors 不能为空]
  stage-submit:
    roles: [developer, human]
    purpose: 原子提交当前 Stage 的实现证据并转为 PENDING_REVIEW。
    required: [--issue-key, --stage-no, --content, --commit-sha]
    governance_v2_required: [--diff-summary, --code-reference, --test-evidence, 已执行 stage-prepare]
    optional: [--resolved-findings, --metadata]
    json_arguments: [--code-reference, --test-evidence, --resolved-findings, --metadata]
    allowed_issue_status: IN_PROGRESS
    allowed_stage_status: IN_PROGRESS
    effects: [保存 commit、Diff、当前与历史测试证据, 追加 STAGE_SUBMITTED, Stage 转 PENDING_REVIEW]
    resubmission_rule: 若上轮存在 BLOCKER/MUST，resolved-findings 必须逐项包含其 finding id；SHOULD/NIT 不要求修复。
    attempt_effect: none
  stage-review:
    roles: [inspector, human]
    purpose: 原子验收当前 PENDING_REVIEW Stage；redesign 是兼容 UI 人工接管的显式整案失效扩展。
    required: [--issue-key, --stage-no, --decision, --content]
    governance_v2_required: [--review-result, approved 时 --baseline]
    optional: [--plan-no]
    json_arguments: [--review-result, --baseline]
    enum: {decision: [auto, approved, rejected, redesign]}
    allowed_issue_status: IN_PROGRESS
    allowed_stage_status: PENDING_REVIEW
    effects:
      approved: [追加 STAGE_APPROVED, 当前 Stage 转 APPROVED, 自动激活下一个 PLANNED Stage]
      rejected: [追加 STAGE_REJECTED, 当前 Stage 回 IN_PROGRESS]
      redesign: [追加 STAGE_REJECTED, 未完成 Stage 转 SUPERSEDED, 追加 STAGE_PLAN_SUPERSEDED, Issue 转 REDESIGN_REQUIRED]
    review_result_schema:
      findings:
        required_keys: [BLOCKER, MUST, SHOULD, NIT]
        item_required: [id, summary]
        blocking_item_required: [evidence, risk]
      historical_regression: "以已批准 stage_no 为 key；每项包含 status=PASS|FAIL 与 evidence"
      current_acceptance: "按原顺序逐项复制 acceptance criterion；每项包含 status=PASS|FAIL 与 evidence"
    baseline_schema:
      required_keys: [verified_behaviors, input_output_contracts, business_semantics, tests]
      non_empty: [verified_behaviors, tests]
    convergence:
      - governance v2 推荐 decision=auto，由 Runtime 按 Gate 计算 approved/rejected；整案失效仍显式 redesign
      - 历史回归 FAIL 必须记录 BLOCKER
      - 第二轮起新增 BLOCKER/MUST 必须有 why_not_found_earlier、evidence、risk
      - 第二轮起新增 SHOULD/NIT 只允许由本轮修复新引入，且必须有 introduced_by_fix=true 与 evidence
      - BLOCKER/MUST 为 0 且当前验收和历史回归全 PASS 时，decision 必须 approved
      - SHOULD/NIT 只作为 Backlog，不能支持 rejected
    returns: [inspection_result, final_decision, review_round, blocking_counts, next_stage_no]
  human-escalate:
    roles: [inspector]
    purpose: 在 Agent 无法取得关键业务事实或存在重大不可逆数据风险时，原子请求 Human 最终边界或安全决策。
    required: [--issue-key, --reason, --question]
    optional: [--options, --evidence, --recommended-option]
    json_arguments: [--options, --evidence]
    effects: [追加 HUMAN_CONFIRMATION_REQUESTED, 转为 HUMAN_CONFIRMATION_REQUIRED]
    content_rules:
      required_summary: [为什么必须人工决定, 已验证事实, 无法确认的事实, 可选方案及影响, Inspector 推荐方案, Human 只需回答的问题]
      forbidden_payload: [未经整理的长日志, 完整代码, Agent 对话记录]
    note: 这是 Inspector-only 的异常升级入口；Human 与 Developer 均不得发起。普通技术不确定性必须先由 Agent 通过证据、DESIGN_GUIDANCE、设计驳回或重新设计解决。
  human-confirmation-resolve:
    roles: [human]
    purpose: 原子记录 Human 的业务边界或风险决定，并恢复 Agent 工作流。
    required: [--issue-key, --decision, --content]
    optional: [--next-status]
    defaults: {next-status: DESIGN_REQUIRED}
    enum: {next-status: [DESIGN_REQUIRED, IN_PROGRESS, ON_HOLD, BLOCKED, CANCELLED]}
    allowed_from: [HUMAN_CONFIRMATION_REQUIRED]
    effects: [追加 HUMAN_CONFIRMATION_PROVIDED, 离开 HUMAN_CONFIRMATION_REQUIRED]
    note: 该专用决策命令不直接转 CONFIRMED；正常恢复后仍由 Inspector 技术闭环。Human 可另用 issue-update-status 覆盖普通状态，但任何角色 CONFIRMED 前仍必须为当前 implementation attempt 留有 VERIFICATION_PASSED。
  activity-append:
    roles: [inspector, developer, human]
    required: [--issue-key, --activity-type, --content]
    optional: [--attempt-no, --result-status, --code-reference, --metadata]
    json_arguments: [--code-reference, --metadata]
    forbidden_atomic_types: [DESIGN_REQUESTED, DESIGN_SUBMITTED, DESIGN_APPROVED, DESIGN_REJECTED, STAGE_PLAN_CREATED, STAGE_SCOPE_DECLARED, STAGE_SUBMITTED, STAGE_APPROVED, STAGE_REJECTED, STAGE_PLAN_SUPERSEDED, HUMAN_CONFIRMATION_REQUESTED, HUMAN_CONFIRMATION_PROVIDED]
    note: DESIGN_GUIDANCE 可由 inspector/human 追加；核心设计活动和 Human 升级活动必须由对应原子命令生成。
    content_format:
      short: 单行纯文本，不添加 Markdown 装饰。
      multiline: 多个独立说明可直接换行；无需强制使用列表。
      markdown: 仅在包含代码、命令、真正的项目列表或复杂层级时使用；代码必须使用 fenced code block。
      principle: 以清晰可读为准，不为格式而格式。
  activity-list:
    roles: [inspector, developer, human]
    required: [--issue-key]
  activity-list-recent:
    roles: [inspector, developer, human]
    purpose: 跨 issue 查询近期活动，避免逐条遍历 issue。
    optional: [--task-key, --activity-type, --since, --limit]
    defaults: {limit: 100}
    constraints: {limit: 1..1000, since: ISO-8601}
    examples:
      - activity-list-recent --task-key RT-TEST --activity-type COMMENT_ADDED
      - activity-list-recent --since 2026-07-22T09:00:00+08:00 --limit 200
  candidate-submit:
    roles: [developer, human]
    purpose: 将新发现提交到独立候选审核队列，不创建正式 issue。
    required: [--task-key, --title, --description, --facts, --rationale]
    optional: [--candidate-key, --evidence, --suggested-dimension, --suggested-severity, --suggested-confidence]
    json_arguments: [--evidence]
  candidate-list:
    roles: [inspector, developer, human]
    optional: [--task-key, --status, --updated-after, --limit]
    default: 仅返回 SUBMITTED 和 UNDER_REVIEW；limit 为 100。
    constraints: {updated-after: ISO-8601 inclusive lower bound, limit: 1..1000}
  candidate-update-status:
    roles: [inspector, human]
    required: [--candidate-key, --status]
    optional: [--content]
    note: ACCEPTED 或 REJECTED 时 --content 必填；接受候选不自动创建正式 issue。

enum_values:
  task_type: [REVIEW, CONTINUOUS]
  stage_status: [PLANNED, IN_PROGRESS, PENDING_REVIEW, APPROVED, SUPERSEDED]
  dimension: [functional_correctness, data_security, stability_concurrency, performance, architecture_extensibility, code_quality, test_observability]
  severity: [critical, high, medium, low]
  remediation_benefit: [high, medium, low]
  remediation_cost: [low, medium, high, extreme]
  disposition: [immediate_fix, current_iteration, near_term_iteration, special_governance, opportunistic_fix, observe, defer, business_confirmation]
  confidence: [high, medium, low]

response:
  success: stdout JSON
  failure: stderr JSON with non-zero exit code

restrictions:
  raw_sql: forbidden
  delete_history: forbidden
  direct_sqlite_access: forbidden
  forged_alias_or_role: forbidden

workflow_statuses:
  task: [PENDING, IN_PROGRESS, ON_HOLD, BLOCKED, CLOSED, CANCELLED]
  issue: [PROPOSED, DESIGN_REQUIRED, DESIGN_PENDING_REVIEW, IN_PROGRESS, ON_HOLD, BLOCKED, INSPECTOR_CONFIRMATION_REQUIRED, HUMAN_CONFIRMATION_REQUIRED, IMPLEMENTED_PENDING_REVIEW, REDESIGN_REQUIRED, CONFIRMED, CANCELLED]
  candidate: [SUBMITTED, UNDER_REVIEW, ACCEPTED, REJECTED]
  stage: [PLANNED, IN_PROGRESS, PENDING_REVIEW, APPROVED, SUPERSEDED]
  task_type: [REVIEW, CONTINUOUS]

activity_types:
  design: [DESIGN_REQUESTED, DESIGN_GUIDANCE, DESIGN_SUBMITTED, DESIGN_APPROVED, DESIGN_REJECTED]
  stage: [STAGE_PLAN_CREATED, STAGE_SCOPE_DECLARED, STAGE_SUBMITTED, STAGE_APPROVED, STAGE_REJECTED, STAGE_PLAN_SUPERSEDED]
  human_confirmation: [HUMAN_CONFIRMATION_REQUESTED, HUMAN_CONFIRMATION_PROVIDED]
  legacy_compatible: [REVIEW_APPROVED, REVIEW_REJECTED, REDESIGN_SUBMITTED]
