<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}代码检查工作台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body data-browser-events-url="{{ url_for('browser_events') }}">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('inbox') }}">代码检查工作台</a>
      <nav class="nav" aria-label="主导航">
        <a href="{{ url_for('inbox') }}" class="{% if request.endpoint == 'inbox' %}active{% endif %}">待我处理</a>
        <a href="{{ url_for('task_list') }}" class="{% if request.endpoint in ['task_list', 'task_detail', 'issue_detail'] %}active{% endif %}">检查任务</a>
        <a href="{{ url_for('candidate_list') }}" class="{% if request.endpoint in ['candidate_list', 'candidate_update_status'] %}active{% endif %}">候选问题</a>
        <a href="{{ url_for('runtime_overview') }}" class="{% if request.endpoint and request.endpoint.startswith('runtime_') %}active{% endif %}">运行状态</a>
      </nav>
      <button type="button" class="notification-toggle" data-browser-notifications hidden>开启桌面提醒</button>
      <div class="workqueue" aria-label="Human 当前待办">
        <a class="queue-pill" href="{{ url_for('inbox') }}#pending-review"><strong>{{ queue_counts.pending_review }}</strong>待审核</a>
        <a class="queue-pill" href="{{ url_for('inbox') }}#confirmation"><strong>{{ queue_counts.confirmation }}</strong>待确认</a>
        <a class="queue-pill" href="{{ url_for('inbox') }}#blocked"><strong>{{ queue_counts.blocked }}</strong>受阻</a>
      </div>
    </div>
  </header>

  <main class="container {% block page_class %}{% endblock %}">
    {% if flash_msg %}
      <div class="flash flash-{{ flash_kind }}" role="alert">
        <span>{{ flash_msg }}</span>
        <button type="button" class="flash-close" aria-label="关闭提示" data-dismiss>×</button>
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">业务写入通过 <span class="mono">review-db.py --agent human</span>；Agent 运行管理通过 Supervisor CLI，并统一校验和审计。</footer>
</body>
</html>
