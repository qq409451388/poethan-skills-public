<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}代码检查工作台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body data-browser-events-url="{{ url_for('browser_events') }}">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('inbox') }}">代码检查工作台</a>
      <nav class="nav" aria-label="主导航">
        <a href="{{ url_for('inbox') }}" class="{% if request.endpoint == 'inbox' %}active{% endif %}">待我处理</a>
        <a href="{{ url_for('task_list') }}" class="{% if request.endpoint in ['task_list', 'task_detail', 'issue_detail'] %}active{% endif %}">检查任务</a>
        <a href="{{ url_for('candidate_list') }}" class="{% if request.endpoint in ['candidate_list', 'candidate_update_status'] %}active{% endif %}">候选问题</a>
        <a href="{{ url_for('routing_config') }}" class="{% if request.endpoint in ['routing_config', 'routing_save', 'routing_validate'] %}active{% endif %}">模型路由配置</a>
      </nav>
      <button type="button" class="notification-toggle" data-browser-notifications hidden>开启桌面提醒</button>
      <div class="workqueue" aria-label="Human 当前待办">
        <button type="button" class="queue-pill" data-modal-open="pending-review-modal" aria-haspopup="dialog"><strong>{{ queue_counts.pending_review }}</strong>待审核</button>
        <button type="button" class="queue-pill" data-modal-open="confirmation-modal" aria-haspopup="dialog"><strong>{{ queue_counts.confirmation }}</strong>待确认</button>
        <button type="button" class="queue-pill" data-modal-open="blocked-modal" aria-haspopup="dialog"><strong>{{ queue_counts.blocked }}</strong>受阻</button>
      </div>
    </div>
  </header>

  <main class="container {% block page_class %}{% endblock %}">
    {% if flash_msg %}
      <div class="flash flash-{{ flash_kind }}" role="alert">
        <span>{{ flash_msg }}</span>
        <button type="button" class="flash-close" aria-label="关闭提示" data-dismiss>×</button>
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  {% with groups=workqueue.groups, candidates=workqueue.candidates %}
    {% include "components/workqueue_modals.html" %}
  {% endwith %}

  <footer class="footer">业务写入通过 <span class="mono">reviewctl</span> 的 WebApp Human 身份入口，统一校验和审计。</footer>
</body>
</html>
