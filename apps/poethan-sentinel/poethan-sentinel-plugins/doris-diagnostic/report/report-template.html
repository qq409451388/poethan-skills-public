<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doris 诊断报告</title>
<style>
:root{color-scheme:light dark;--ink:#17212b;--muted:#66788a;--panel:#fff;--bg:#eef3f5;--brand:#147d91;--line:#d9e2e7;--warn:#b76d00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{max-width:1080px;margin:0 auto;padding:36px}.hero{background:linear-gradient(130deg,#0f5364,#1694a8);color:white;border-radius:18px;padding:28px 32px;box-shadow:0 12px 32px #0b596633}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}.hero h1{margin:8px 0;font-size:30px}.meta{opacity:.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.card h2{font-size:16px;margin:0 0 12px;color:var(--brand)}.finding{border-left:4px solid var(--warn);padding:8px 12px;margin:10px 0;background:#d28a2f12}.section{margin-top:16px}.section h3{margin:0;background:#dcebef;padding:10px 14px;border-radius:10px 10px 0 0;font-size:13px}.section pre{margin:0;padding:14px;background:#0f1720;color:#dce7ec;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:0 0 10px 10px;font:12px SFMono-Regular,Menlo,monospace;max-height:460px;overflow:auto}@media(prefers-color-scheme:dark){:root{--ink:#e6edf2;--muted:#9aacb8;--panel:#17212b;--bg:#0e151b;--line:#2b3b47}.section h3{background:#203844}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">Poethan Sentinel · Doris Diagnostic</div><h1 id="server"></h1><div id="summary"></div><div class="meta" id="meta"></div></header><section class="grid"><article class="card"><h2>确定性发现</h2><div id="findings"></div></article><article class="card"><h2>报告信息</h2><div id="info"></div></article></section><section id="sections"></section></main>
<script>
const report=__REPORT_JSON__;const schema=__REPORT_SCHEMA__;
const text=(id,value)=>document.getElementById(id).textContent=value;
text('server',report.server);text('summary',report.summary);text('meta',new Date(report.generatedAt).toLocaleString());text('info',`Schema: ${schema.title||'Doris'} · AI 增强: ${report.enhancedByAI?'是':'否'}`);
const findings=document.getElementById('findings');if(!report.findings.length){findings.textContent='没有 App 或 AI 生成的异常项。'}else report.findings.forEach(f=>{const node=document.createElement('div');node.className='finding';node.textContent=`${f.title}\n${f.evidence}\n建议：${f.recommendation}`;findings.appendChild(node)});
const container=document.getElementById('sections');const raw=report.outputs.map(o=>o.text).join('\n\n');const parts=raw.split(/^===== SECTION: ([^=]+) =====$/m);for(let i=1;i<parts.length;i+=2){const section=document.createElement('article');section.className='section';const title=document.createElement('h3');title.textContent=parts[i].trim();const pre=document.createElement('pre');pre.textContent=(parts[i+1]||'').trim();section.append(title,pre);container.appendChild(section)}
</script></body></html>
