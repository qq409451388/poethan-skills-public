<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磁盘使用分析</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--text:#18202a;--muted:#6b7280;--line:#e5e7eb;
  --blue:#2f80ed;--warn:#f59e0b;--danger:#e5484d;--ok:#16a34a;--barbg:#e8edf3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:22px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:14px}
h1{margin:0;font-size:22px}.meta{font-size:12px;color:var(--muted);text-align:right}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.kpi{padding:11px 12px}.kpi b{display:block;font-size:18px;margin-top:2px}.kpi span{font-size:11px;color:var(--muted)}
.panel{padding:13px 14px;margin-top:12px}.title{font-size:13px;font-weight:700;margin-bottom:8px}
.mount{display:grid;grid-template-columns:220px 1fr 86px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mount:first-of-type{border-top:0}.drive{display:flex;gap:10px;align-items:center;min-width:0}
.ico{width:32px;height:22px;border:1px solid #9aa4b2;border-radius:3px;background:linear-gradient(#fff,#dfe5ec);position:relative;flex:0 0 auto}
.ico:after{content:"";position:absolute;left:5px;right:5px;bottom:4px;height:3px;border-radius:2px;background:#94a3b8}
.name{min-width:0}.name strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barbox{min-width:0}.bar{height:13px;background:var(--barbg);border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--blue)}
.fill.warn{background:var(--warn)}.fill.danger{background:var(--danger)}
.detail{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.pct{text-align:right;font-size:13px;font-weight:700}.pct small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hotrow{display:grid;grid-template-columns:minmax(0,1fr) 130px 78px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hotrow:first-of-type{border-top:0}
.path{min-width:0;font:12px/1.3 "SFMono-Regular",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:8px;background:var(--barbg);border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;background:var(--blue)}
.size{text-align:right;font-size:12px;font-weight:700}
.alerts{display:flex;gap:8px;flex-wrap:wrap}.alert{font-size:11px;padding:5px 8px;border-radius:6px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.alert.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.note{font-size:11px;color:var(--muted);margin-top:9px}
@media(max-width:760px){
  .wrap{padding:14px}.summary{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}
  .mount{grid-template-columns:1fr}.pct{text-align:left}.head{align-items:flex-start;flex-direction:column}.meta{text-align:left}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>磁盘使用分析</h1><div id="host" class="note"></div></div>
    <div id="time" class="meta"></div>
  </div>

  <div class="summary">
    <div class="kpi"><span>总容量</span><b id="total">-</b></div>
    <div class="kpi"><span>已使用</span><b id="used">-</b></div>
    <div class="kpi"><span>可用空间</span><b id="free">-</b></div>
    <div class="kpi"><span>最高占用</span><b id="maxPct">-</b></div>
  </div>

  <div class="panel">
    <div class="title">挂载点</div>
    <div id="mounts"></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="title">大目录 Top</div>
      <div id="dirs"></div>
    </div>
    <div class="panel">
      <div class="title">大文件 Top</div>
      <div id="files"></div>
    </div>
  </div>

  <div class="panel">
    <div class="title">结论</div>
    <div id="alerts" class="alerts"></div>
  </div>

  <div class="note">阈值：挂载点 ≥90% 红色、≥80% 黄色。目录/文件条形图按各自 Top 列表最大值归一化，AI 无需输出百分比。</div>
</div>

<script>
/*
AI 最小 JSON：
{
  "h":"prod-api-01",
  "ts":"2026-09-17 13:10",
  "d":[["/",536870912000,365072220160,"ext4"],["/data",1099511627776,923417968640,"xfs"]],
  "dirs":[["/data/mysql",442381631488],["/var/log",38654705664]],
  "files":[["/data/mysql/binlog.000881",17179869184],["/var/log/app.log",8589934592]]
}

d: [mount,totalBytes,usedBytes,fs]
dirs/files: [path,sizeBytes]
free / percent / status / top占比 全由前端计算。
*/
const report=__REPORT_JSON__;

const fmt=n=>{
  const u=["B","KB","MB","GB","TB","PB"];let i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++}
  return `${n>=100||i<2?n.toFixed(0):n.toFixed(1)} ${u[i]}`;
};
const pct=(u,t)=>t?u/t*100:0;
const level=p=>p>=90?"danger":p>=80?"warn":"";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.getElementById("host").textContent=`主机：${report.h}`;
document.getElementById("time").textContent=`生成时间 ${report.ts}`;

let total=0,used=0,max=0,warn=[];
document.getElementById("mounts").innerHTML=(report.d||[]).map(x=>{
  const [m,t,u,fs]=x,p=pct(u,t),f=t-u,lv=level(p);
  total+=t;used+=u;max=Math.max(max,p);
  if(p>=80)warn.push(`${m} ${p.toFixed(0)}%`);
  return `<div class="mount">
    <div class="drive">
      <div class="ico"></div>
      <div class="name"><strong>${esc(m)}</strong><small>${esc(fs)} · ${fmt(t)}</small></div>
    </div>
    <div class="barbox">
      <div class="bar"><div class="fill ${lv}" style="width:${Math.min(p,100)}%"></div></div>
      <div class="detail"><span>已用 ${fmt(u)}</span><span>可用 ${fmt(f)}</span></div>
    </div>
    <div class="pct">${p.toFixed(1)}%<small>${fmt(f)} free</small></div>
  </div>`;
}).join("");

const renderTop=(id,list)=>{
  const rows=list||[];
  const maxSize=Math.max(...rows.map(x=>x[1]),1);
  document.getElementById(id).innerHTML=rows.length?rows.map(([path,size])=>`
    <div class="hotrow" title="${esc(path)}">
      <div class="path">${esc(path)}</div>
      <div class="mini"><i style="width:${size/maxSize*100}%"></i></div>
      <div class="size">${fmt(size)}</div>
    </div>`).join(""):`<div class="note">本次未采集到数据。</div>`;
};
renderTop("dirs",report.dirs);
renderTop("files",report.files);

document.getElementById("total").textContent=fmt(total);
document.getElementById("used").textContent=fmt(used);
document.getElementById("free").textContent=fmt(total-used);
document.getElementById("maxPct").textContent=`${max.toFixed(1)}%`;

document.getElementById("alerts").innerHTML=warn.length
  ?warn.map(x=>`<span class="alert">${esc(x)}，建议清理</span>`).join("")
  :`<span class="alert ok">所有挂载点占用均低于 80%</span>`;
</script>
</body>
</html>
