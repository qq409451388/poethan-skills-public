<!doctype html><meta charset="utf-8"><title>Poethan Sentinel Report</title><style>body{font:15px -apple-system;margin:44px;max-width:900px;color:#1d2939}h1{color:#176b87}pre{white-space:pre-wrap;background:#f2f6f8;padding:16px;border-radius:10px}article{border-left:4px solid #176b87;padding:10px 16px;margin:12px 0}</style><h1>Poethan Sentinel</h1><div id="report"></div><script>const r=__REPORT_JSON__;document.querySelector('#report').innerHTML=`<h2>${r.server}</h2><p>${r.summary}</p>`+r.findings.map(f=>`<article><b>${f.title}</b><br>${f.evidence}<br><small>${f.recommendation}</small></article>`).join('')+`<h2>原始输出</h2>`+r.outputs.map(o=>`<h3>${o.pluginName} · exit ${o.exitCode}</h3><pre>${o.text}</pre>`).join('')</script>
